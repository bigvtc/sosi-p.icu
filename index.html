<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sosi-p.icu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: lightslategrey;
            font-family: sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 320px;
        }
        .links-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .text-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 42px;
            padding: 0 20px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, filter 0.2s ease;
        }
        .text-btn:hover {
            transform: scale(1.06) rotate(-1deg);
            filter: brightness(1.15);
        }
        .text-btn:active {
            transform: scale(0.98);
        }
        .btn-tg {
            background-color: #0284c7;
        }
        .btn-gh {
            background-color: #1a1a1a;
        }
        .btn-gh:hover {
            background-color: #2b2b2b;
        }
    </style>
</head>
<body>

<main class="card">
    <nav>
        <ul class="links-list">
            <li><a href="https://t.me/cntrlln" target="_blank" class="text-btn btn-tg">controllin telegram</a></li>
            <li><a href="https://t.me/nigger1790" target="_blank" class="text-btn btn-tg">personal telegram</a></li>
            <li><a href="https://t.me/zovutil" target="_blank" class="text-btn btn-tg">zutil telegram (outdated)</a></li>
            <li><a href="https://github.com/k4ties" target="_blank" class="text-btn btn-gh">personal github</a></li>
            <li><a href="https://github.com/zovgo" target="_blank" class="text-btn btn-gh">github org 1 (zovgo)</a></li>
            <li><a href="https://github.com/something-that-is-cool" target="_blank" class="text-btn btn-gh">github org 2 (smtic)</a></li>
        </ul>
    </nav>
</main>

</body>
</html>
